services:
  - type: web
    name: garage-management
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://garage-management-1h9b.onrender.com
      - key: VITE_API_URL
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: garage-management-db
          property: connectionString

databases:
  - name: garage-management-db
    plan: free
    databaseName: garage_management
    user: garage_management
    postgresMajorVersion: "18"
